          cluster headache, acute rhinosinusitis, cervicogenic headache, occipital neuralgia,
          trigeminal neuralgia, SUNCT/SUNA, paroxysmal hemicrania, temporomandibular disorder,
          giant cell arteritis, idiopathic intracranial hypertension, low-pressure headache,

    <template data-neo-disclaimer data-label="Where this comes from" data-title="About these patterns">
      <p>These descriptions follow the patterns published in the International Classification of Headache Disorders (ICHD-3, ichd-3.org). They are written to help someone <strong>describe</strong> what they feel, not to diagnose it.</p>
      <p>Many different conditions share the same locations, and real pain rarely matches a textbook exactly. A pattern that fits what you feel is a starting point for a conversation with a clinician, never a conclusion.</p>
